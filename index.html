<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col relative">

    <!-- Loading Overlay for Firebase Auth & Data Fetching -->

        <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600 mb-3"></i>
        <p class="text-sm font-semibold text-slate-600 animate-pulse">데이터 동기화 중...</p>
    </div>

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-robot text-xl"></i>
                <h1 class="text-base font-bold">로봇카페 스마트 재고</h1>
            </div>
            <div class="text-[10px] bg-indigo-500 px-2 py-1 rounded-full flex items-center shadow-inner">
                <span id="sync-status" class="w-2 h-2 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>
                실시간 연동중
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 sticky top-[52px] z-40">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('inventory')" id="tab-inventory" class="flex-1 py-2.5 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 text-center transition-colors">
                <i class="fa-solid fa-boxes-stacked mr-1"></i> 재고 현황
            </button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-2.5 text-sm font-semibold text-slate-500 border-b-2 border-transparent text-center transition-colors">
                <i class="fa-solid fa-calendar-days mr-1"></i> 이력
            </button>
            <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-2.5 text-sm font-semibold text-slate-500 border-b-2 border-transparent text-center transition-colors">
                <i class="fa-solid fa-gear mr-1"></i> 설정
            </button>
        </div>
    </nav>

    <!-- Main Container -->

        <!-- Tab 1: Inventory Management -->
        <section id="view-inventory" class="space-y-2.5">
            <div class="flex justify-between items-center bg-white p-2.5 rounded-xl shadow-sm border border-slate-100">
                <div>
                    <h2 class="font-bold text-slate-700 text-xs flex items-center gap-1.5">
                        <i class="fa-regular fa-calendar text-indigo-500"></i>
                        <span id="today-date-display">오늘 날짜</span>
                    </h2>
                    <p class="text-[10px] text-slate-400 mt-0.5">수량 조절 후 꼭 저장버튼을 누르세요</p>
                </div>
                <div class="flex space-x-1.5">
                    <button onclick="openBatchModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium text-xs transition flex items-center gap-1 border border-slate-200">
                        <i class="fa-solid fa-truck-ramp-box"></i> 입고
                    </button>
                    <button onclick="saveInventoryToHistory()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-2.5 py-1.5 rounded-lg font-medium text-xs shadow-md transition flex items-center gap-1">
                        <i class="fa-solid fa-floppy-disk"></i> 저장
                    </button>
                </div>
            </div>

            <div id="category-filters" class="flex gap-1.5 overflow-x-auto pb-1 hide-scrollbar">
                <!-- Category buttons will be injected here -->
            </div>

            <!-- Inventory Items Container -->
            <div id="inventory-list" class="space-y-1.5">
                <!-- Dynamic Items will be injected here -->
            </div>
        </section>

        <!-- Tab 2: Calendar & History -->
        <section id="view-calendar" class="hidden space-y-3">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-end gap-2">
                <div class="flex-1">
                    <h2 class="font-bold text-slate-700 text-xs mb-1.5"><i class="fa-solid fa-calendar text-indigo-500 mr-1.5"></i>날짜 선택</h2>
                    <input type="date" id="selected-date" onchange="loadHistoryForDate()" class="w-full p-2 border border-slate-200 rounded-lg text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="exportHistoryToCSV()" class="h-[38px] px-3 bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-file-csv"></i> 다운로드
                </button>
            </div>

            <!-- Chart Container -->
            <div id="chart-container" class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 hidden">
                <h3 class="font-bold text-slate-700 text-xs mb-2"><i class="fa-solid fa-chart-simple text-indigo-500 mr-1.5"></i>재고 수준 그래프</h3>
                <div class="h-44 w-full relative">
                    <canvas id="inventory-chart"></canvas>
                </div>
            </div>

            <!-- History Editor Container -->
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-slate-700 text-xs flex items-center">
                        이력 조회
                        <span id="history-date-label" class="ml-2 text-[10px] font-normal px-2 py-0.5 bg-slate-100 text-slate-500 rounded-full">-</span>
                    </h3>
                    <div class="flex gap-1.5">
                        <button id="btn-toggle-history-edit" onclick="toggleHistoryEditMode()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition items-center gap-1 border border-slate-200">
                            <i class="fa-solid fa-pen"></i> 수정
                        </button>
                        <button id="btn-save-history-edit" onclick="saveEditedHistory()" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold shadow-sm transition items-center gap-1">
                            <i class="fa-solid fa-check"></i> 저장
                        </button>
                    </div>
                </div>
                
                <div id="history-list" class="space-y-1.5">

        <!-- Tab 3: Settings (Add/Remove Items) -->

    <!-- Batch Input Modal -->

                <button onclick="closeBatchModal()" class="text-slate-400 hover:text-slate-600 w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="bg-amber-50 border border-amber-200 rounded-lg p-2 mb-3">
                <p class="text-[10px] text-amber-700 leading-tight">입고된 수량을 입력해주세요. 입력한 수량은 당일 '소모량' 계산 시 보정치로 활용되며 현재 수량에 더해집니다.</p>

            </div>
        </div>
    </div>
    
    <!-- Custom Modal UI for Confirmations (replaces window.confirm) -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden flex-col justify-center items-center p-4">

            <p id="confirm-msg" class="text-xs text-slate-600 mb-4"></p>

                <button id="btn-confirm-cancel" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition">취소</button>

        // Custom Confirm Modal Helper
        function showConfirm(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-msg').textContent = message;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);

            const btnOk = document.getElementById('btn-confirm-ok');
            const btnCancel = document.getElementById('btn-confirm-cancel');
            
            // Cleanup previous listeners
            const newBtnOk = btnOk.cloneNode(true);
            const newBtnCancel = btnCancel.cloneNode(true);
            btnOk.parentNode.replaceChild(newBtnOk, btnOk);
            btnCancel.parentNode.replaceChild(newBtnCancel, btnCancel);

            newBtnCancel.onclick = () => {
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
            };

            newBtnOk.onclick = () => {
                onConfirm();
                newBtnCancel.click(); // Close modal
            };
        }

        // --- Firebase Initialization & Sync ---
        async function initFirebase() {
            try {
                // Rule 3: Auth Before Queries
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                if (!auth.currentUser) throw new Error("Authentication failed");
                
                isFirebaseReady = true;
                setupRealtimeSync();

            } catch (error) {
                console.error("Firebase init error:", error);
                document.getElementById('loading-overlay').classList.add('hidden');
                showToast("오프라인 모드로 실행됩니다. (연동 실패)", "error");
                // Fallback to local defaults if Firebase fails
                loadDefaultData();
            }
        }

        function setupRealtimeSync() {
            if (!auth.currentUser) return;

            // Rule 1: Strict Paths - Using public/data for shared inventory state
            const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory_state', 'main');
            
            // Listen for changes from any user
            onSnapshot(stateRef, (docSnap) => {
                document.getElementById('loading-overlay').classList.add('hidden');
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Decode stringified arrays to bypass complex merging issues
                    if (data.inventoryString) {
                        try {
                            inventoryData = JSON.parse(data.inventoryString);
                        } catch(e) { console.error("Parse error inventory"); }
                    }
                    if (data.historyString) {
                        try {
                            historyLogs = JSON.parse(data.historyString);
                        } catch(e) { console.error("Parse error history"); }
                    }
                    
                    // Re-render UI
                    updateUIFromData();
                    
                } else {
                    // First time initialization for all users
                    loadDefaultData();
                    saveDataToFirebase(); // Broadcast defaults
                }
            }, (error) => {
                console.error("Realtime sync error:", error);
                showToast("데이터 동기화 오류 발생", "error");
            });
        }

        async function saveDataToFirebase() {
            if (!isFirebaseReady || !auth.currentUser) return;
            
            try {
                const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory_state', 'main');
                
                // Stringify nested arrays to respect Firestore structure recommendations for simple sync
                await setDoc(stateRef, {
                    inventoryString: JSON.stringify(inventoryData),
                    historyString: JSON.stringify(historyLogs),
                    lastUpdated: new Date().toISOString()
                });
            } catch (error) {
                console.error("Save to Firebase error:", error);
                showToast("저장 실패", "error");
            }
        }

        // Request 4: Improved Consumption Analysis accounting for inbound stock
       function analyzeConsumption() {
    const sortedDates = Object.keys(historyLogs).sort();
    if (sortedDates.length < 2) return null;

    let itemConsumption = {};
    inventoryData.forEach(item => itemConsumption[item.name] = 0);

    let totalValidDays = 0;
    const targetValidDays = 10; // 최근 10일의 영업일 기준
    
    // 뒤쪽(최신 날짜)부터 거꾸로 탐색하며 최근 10일의 영업일을 채움
    let validDaysCount = 0;
    let usedDates = [];

    for (let i = sortedDates.length - 1; i > 0; i--) {
        const date2Str = sortedDates[i];
        const date1Str = sortedDates[i - 1];
        
        const date1 = new Date(date1Str);
        const date2 = new Date(date2Str);

        let currentDaysInInterval = 0;
        let currDate = new Date(date1);
        currDate.setDate(currDate.getDate() + 1);

        // 두 날짜 사이의 영업일(일요일 제외) 계산
        while (currDate <= date2) {
            if (currDate.getDay() !== 0) { // 일요일(0)이 아니면 영업일로 인정
                currentDaysInInterval++;
            }
            currDate.setDate(currDate.getDate() + 1);
        }

        if (currentDaysInInterval > 0) {
            const log1 = historyLogs[date1Str];
            const log2 = historyLogs[date2Str];

            log1.forEach(item1 => {
                const item2 = log2.find(i => i.name === item1.name);
                if (item2) {
                    const inbound = item2.inbound || 0; 
                    const consumed = (item1.current + inbound) - item2.current;
                    if (consumed > 0) {
                        itemConsumption[item1.name] = (itemConsumption[item1.name] || 0) + consumed;
                    }
                }
            });

            totalValidDays += currentDaysInInterval;
            validDaysCount++;
        }

        // 최근 10일치 영업일 분량이 채워지면 중단
        if (totalValidDays >= targetValidDays) break;
    }

    let stats = {};
    inventoryData.forEach(item => {
        const totalConsumed = itemConsumption[item.name] || 0;
        // 누적된 유효 영업일이 0보다 크면 그 일수로 나누고, 아니면 0 처리
        const dailyAvg = totalValidDays > 0 ? (totalConsumed / totalValidDays) : 0;
        stats[item.name] = {
            dailyAvg: dailyAvg,
            safeStock: dailyAvg * 3
        };
    });
    
    return { totalValidDays, stats };
}

        function exportHistoryToCSV() {
            const dateVal = document.getElementById('selected-date').value;
            const dataToExport = historyLogs[dateVal];

            if (!dataToExport || dataToExport.length === 0) {
                showToast("해당 날짜에 내보낼 데이터가 없습니다.", "error");
                return;
            }

            const BOM = "\uFEFF";
            let csvContent = "카테고리,품목명,기준수량,현재수량,상태,당일입고\n";

            dataToExport.forEach(item => {
                const status = item.current < item.standard ? "부족" : "정상";
                const inbound = item.inbound || 0;
                const row = `"${item.category}","${item.name}",${item.standard},${item.current},"${status}",${inbound}`;
                csvContent += row + "\n";
            });

            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", `로봇카페_재고내역_${dateVal}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("CSV 파일이 다운로드되었습니다.");
        }

        function renderChart(data) {
            const ctx = document.getElementById('inventory-chart').getContext('2d');
            
            const labels = data.map(item => item.name);
            const currentData = data.map(item => item.current);
            const standardData = data.map(item => item.standard);
            
            const bgColors = data.map(item => item.current < item.standard ? 'rgba(239, 68, 68, 0.85)' : 'rgba(99, 102, 241, 0.85)');

            if (inventoryChart) {
                inventoryChart.data.labels = labels;
                inventoryChart.data.datasets[0].data = currentData;
                inventoryChart.data.datasets[0].backgroundColor = bgColors;
                inventoryChart.data.datasets[1].data = standardData;
                inventoryChart.update('none'); // Update without full animation for performance
            } else {
                inventoryChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '현재 수량',
                                data: currentData,
                                backgroundColor: bgColors,
                                borderRadius: 4,
                                barPercentage: 0.7
                            },
                            {
                                label: '기준 수량',
                                data: standardData,
                                type: 'line',
                                borderColor: 'rgba(148, 163, 184, 0.9)', 
                                borderDash: [4, 4],
                                borderWidth: 2,
                                pointRadius: 0,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 300 },
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                ticks: { stepSize: 1, font: { size: 9 } },
                                grid: { color: '#f1f5f9' }
                            },
                            x: { 
                                ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 45 },
                                grid: { display: false }
                            }
                        },
                        plugins: {
                            legend: { 
                                display: true, 
                                position: 'top', 
                                labels: { boxWidth: 12, font: { size: 10, family: "'Inter', sans-serif" } } 
                            },
                            tooltip: {
                                padding: 10,
                                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                titleFont: { size: 11, family: "'Inter'" },
                                bodyFont: { size: 12, family: "'Inter'", weight: 'bold' },
                                callbacks: {
                                    label: function(context) {
                                        return context.dataset.label + ': ' + context.raw + '개';
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }


        function renderSettingsList() {
            const listContainer = document.getElementById('settings-item-list');
            listContainer.innerHTML = '';

            inventoryData.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100 gap-2";
                row.innerHTML = `
                    <div class="flex flex-col flex-1 overflow-hidden">
                        <span class="text-[10px] text-slate-500 font-medium truncate">${item.category}</span>
                        <span class="text-sm font-bold text-slate-800 truncate">${item.name}</span>
                    </div>
                    <div class="flex items-center shrink-0 space-x-2">
                        <div class="flex items-center bg-white border border-slate-200 rounded-lg px-2 py-1 shadow-sm">
                            <label for="std-${index}" class="text-[10px] text-slate-500 mr-1.5 cursor-pointer font-medium">기준</label>
                            <input type="number" id="std-${index}" min="0" value="${item.standard}" onchange="updateStandard(${index}, this.value)" class="w-10 text-sm text-right focus:outline-none focus:text-indigo-600 font-bold text-slate-800 bg-transparent">
                        </div>
                        <button onclick="removeItem(${index})" class="w-8 h-8 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center transition shadow-sm" title="삭제">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        function updateStandard(index, newValue) {
            const parsedValue = parseInt(newValue);
            if (!isNaN(parsedValue) && parsedValue >= 0) {
                inventoryData[index].standard = parsedValue;
                saveDataToFirebase();
                showToast(`'${inventoryData[index].name}' 기준수량 변경됨`);
            } else {
                showToast("올바른 수량을 입력해주세요.", "error");
                renderSettingsList(); 
            }
        }

        function addItem() {
            const category = document.getElementById('new-category').value.trim();
            const name = document.getElementById('new-name').value.trim();
            const standard = parseInt(document.getElementById('new-standard').value);

            if (!category || !name || isNaN(standard)) {
                showToast("모든 항목을 올바르게 입력해주세요.", "error");
                return;
            }

            inventoryData.push({
                category: category,
                name: name,
                standard: standard,
                current: 0,
                inbound: 0 // Initialize inbound
            });

            saveDataToFirebase();

            document.getElementById('new-category').value = '';
            document.getElementById('new-name').value = '';
            document.getElementById('new-standard').value = '';

            showToast(`'${name}' 품목이 추가되었습니다.`);
        }

        function removeItem(index) {
            const itemName = inventoryData[index].name;
            showConfirm("품목 삭제", `'${itemName}' 품목을 정말 삭제하시겠습니까? 전체 기기에 반영됩니다.`, () => {
                inventoryData.splice(index, 1);
                
                const remainingCategories = new Set(inventoryData.map(item => item.category));
                if (currentCategoryFilter !== '전체' && !remainingCategories.has(currentCategoryFilter)) {
                    currentCategoryFilter = '전체';
                }

                saveDataToFirebase();
                showToast("품목이 삭제되었습니다.");
            });
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const icon = document.getElementById('toast-icon');
            
            toastMsg.textContent = message;
            
            if (type === "error") {
                icon.className = "fa-solid fa-triangle-exclamation text-red-400 text-sm";
                toast.classList.replace('border-slate-700', 'border-red-500/50');
            } else {
                icon.className = "fa-solid fa-check-circle text-emerald-400 text-sm";
                toast.classList.replace('border-red-500/50', 'border-slate-700');
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-[-10px]');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toast.classList.remove('translate-y-[-10px]');
            }, 3000);
        }
    </script>
</body>
</html>
